name: Tests

on:
    push:
    pull_request:

jobs:
    unit-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up OCaml
              uses: ocaml/setup-ocaml@v3
              with:
                  ocaml-compiler: 5.2
                  cache: true

            - name: Install test dependencies
              run: opam install dune alcotest

            - name: Run unit tests
              run: opam exec -- dune test
